<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter, system-ui, Segoe UI, sans-serif" role="img" aria-label="GRAPHEN end-to-end pipeline: lease PDFs are extracted with NER and LLMs into a Neo4j knowledge graph, then grounded Graph-RAG reasoning powers Ask AI, the Risk Dashboard and the Graph Explorer.">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#eef2fb"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#588BFA"/>
      <stop offset="100%" stop-color="#7252A4"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#588BFA" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#588BFA" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#588BFA" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#588BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#588BFA" fill-opacity="0.05"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e293b" flood-opacity="0.10"/>
    </filter>
    <filter id="softSm" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1e293b" flood-opacity="0.14"/>
    </filter>
    <style>
      .flow { stroke-dasharray: 5 9; animation: dash 1.3s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:.5 } 50% { opacity:1 } }
      .float { animation: float 4s ease-in-out infinite; }
      @keyframes float { 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-5px) } }
    </style>
  </defs>

  <!-- Backdrop -->
  <rect x="0" y="0" width="1200" height="640" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="640" fill="url(#dots)"/>
  <circle cx="705" cy="320" r="330" fill="url(#glow)"/>

  <!-- Title -->
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#1e293b" letter-spacing="0.5">Experience <tspan fill="#588BFA">GRAPHEN</tspan></text>

  <!-- Stage headers with numbered badges -->
  <!-- 1 -->
  <circle cx="76" cy="76" r="13" fill="#588BFA" filter="url(#softSm)"/>
  <text x="76" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
  <text x="98" y="73" font-weight="700" font-size="14.5" fill="#1e293b">INGEST</text>
  <text x="98" y="92" font-size="11.5" fill="#64748b">Commercial lease PDFs</text>
  <!-- 2 -->
  <circle cx="356" cy="76" r="13" fill="#7252A4" filter="url(#softSm)"/>
  <text x="356" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
  <text x="378" y="73" font-weight="700" font-size="14.5" fill="#1e293b">EXTRACT</text>
  <text x="378" y="92" font-size="11.5" fill="#64748b">spaCy NER + LLM</text>
  <!-- 3 -->
  <circle cx="631" cy="76" r="13" fill="#1FB16D" filter="url(#softSm)"/>
  <text x="631" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
  <text x="653" y="73" font-weight="700" font-size="14.5" fill="#1e293b">KNOWLEDGE GRAPH</text>
  <text x="653" y="92" font-size="11.5" fill="#64748b">Neo4j · ontology-aligned</text>
  <!-- 4 -->
  <circle cx="946" cy="76" r="13" fill="#FFB020" filter="url(#softSm)"/>
  <text x="946" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
  <text x="968" y="73" font-weight="700" font-size="14.5" fill="#1e293b">REASON &amp; DELIVER</text>
  <text x="968" y="92" font-size="11.5" fill="#64748b">Graph-RAG · grounded</text>

  <!-- Stage 1: PDF documents -->
  <g class="float">
    <g transform="translate(92,155)">
      <rect x="0" y="0" width="118" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-opacity="0.6" filter="url(#soft)"/>
      <rect x="13" y="13" width="118" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-opacity="0.45"/>
      <rect x="26" y="26" width="118" height="150" rx="10" fill="#ffffff" stroke="#588BFA" stroke-width="1.5" filter="url(#soft)"/>
      <g transform="translate(26,26)">
        <rect x="16" y="18" width="66" height="9" rx="4.5" fill="url(#blueGrad)"/>
        <rect x="16" y="40" width="86" height="5" rx="2.5" fill="#cbd5e1"/>
        <rect x="16" y="53" width="86" height="5" rx="2.5" fill="#cbd5e1"/>
        <rect x="16" y="66" width="58" height="5" rx="2.5" fill="#cbd5e1"/>
        <rect x="16" y="90" width="86" height="6" rx="3" fill="#FFB020" fill-opacity="0.75"/>
        <rect x="16" y="104" width="70" height="5" rx="2.5" fill="#cbd5e1"/>
        <rect x="16" y="124" width="52" height="16" rx="5" fill="#1FB16D" fill-opacity="0.18"/>
        <text x="42" y="135" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1FB16D">LEASE</text>
      </g>
    </g>
  </g>

  <!-- flow 1 -> 2 -->
  <line class="flow" x1="268" y1="236" x2="352" y2="236" stroke="url(#flowGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M350,231 L358,236 L350,241 Z" fill="#588BFA"/>

  <!-- Stage 2: NER + LLM chip -->
  <g transform="translate(360,158)">
    <rect x="0" y="0" width="140" height="158" rx="18" fill="#ffffff" stroke="#7252A4" stroke-width="1.5" filter="url(#soft)"/>
    <g stroke="#7252A4" stroke-width="2.5" stroke-linecap="round">
      <line x1="-9" y1="32" x2="0" y2="32"/><line x1="140" y1="32" x2="149" y2="32"/>
      <line x1="-9" y1="60" x2="0" y2="60"/><line x1="140" y1="60" x2="149" y2="60"/>
      <line x1="-9" y1="98" x2="0" y2="98"/><line x1="140" y1="98" x2="149" y2="98"/>
      <line x1="-9" y1="126" x2="0" y2="126"/><line x1="140" y1="126" x2="149" y2="126"/>
    </g>
    <rect x="26" y="26" width="88" height="106" rx="12" fill="url(#blueGrad)"/>
    <text x="70" y="70" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">NER</text>
    <text x="70" y="92" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">+ LLM</text>
    <circle cx="70" cy="112" r="3.5" fill="#fff" class="pulse"/>
  </g>

  <!-- extracted entity chips -->
  <g font-size="11" font-weight="700">
    <g transform="translate(516,150)" filter="url(#softSm)"><rect width="74" height="24" rx="12" fill="#fff" stroke="#588BFA" stroke-opacity="0.5"/><circle cx="14" cy="12" r="4" fill="#588BFA"/><text x="44" y="16" text-anchor="middle" fill="#588BFA">Property</text></g>
    <g transform="translate(516,184)" filter="url(#softSm)"><rect width="74" height="24" rx="12" fill="#fff" stroke="#1FB16D" stroke-opacity="0.5"/><circle cx="14" cy="12" r="4" fill="#1FB16D"/><text x="44" y="16" text-anchor="middle" fill="#1FB16D">Tenant</text></g>
    <g transform="translate(516,218)" filter="url(#softSm)"><rect width="74" height="24" rx="12" fill="#fff" stroke="#FFB020" stroke-opacity="0.5"/><circle cx="14" cy="12" r="4" fill="#FFB020"/><text x="44" y="16" text-anchor="middle" fill="#a86a00">Clause</text></g>
    <g transform="translate(516,252)" filter="url(#softSm)"><rect width="74" height="24" rx="12" fill="#fff" stroke="#f7768e" stroke-opacity="0.5"/><circle cx="14" cy="12" r="4" fill="#f7768e"/><text x="44" y="16" text-anchor="middle" fill="#f7768e">Rent</text></g>
  </g>

  <!-- flow 2 -> 3 -->
  <line class="flow" x1="596" y1="200" x2="618" y2="200" stroke="url(#flowGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M616,195 L624,200 L616,205 Z" fill="#7252A4"/>

  <!-- Stage 3: Knowledge Graph -->
  <g transform="translate(565,120)">
    <circle cx="145" cy="205" r="188" fill="#ffffff" fill-opacity="0.6" stroke="#588BFA" stroke-opacity="0.18" filter="url(#soft)"/>
    <circle cx="145" cy="205" r="188" fill="none" stroke="#588BFA" stroke-opacity="0.10" stroke-width="12"/>
    <g stroke="#cbd5e1" stroke-width="1.6" fill="none">
      <path d="M145,205 L62,112"/><path d="M145,205 L240,98"/><path d="M145,205 L262,225"/>
      <path d="M145,205 L155,335"/><path d="M145,205 L42,255"/><path d="M145,205 L58,320"/>
      <path d="M62,112 L240,98"/><path d="M240,98 L262,225"/><path d="M262,225 L155,335"/>
      <path d="M155,335 L58,320"/><path d="M58,320 L42,255"/><path d="M42,255 L62,112"/>
    </g>
    <!-- nodes -->
    <g class="float"><circle cx="62" cy="112" r="17" fill="#7252A4" fill-opacity="0.14" class="pulse"/><circle cx="62" cy="112" r="12" fill="#7252A4" filter="url(#softSm)"/><circle cx="58" cy="108" r="3.4" fill="#fff" fill-opacity="0.45"/><text x="62" y="93" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b">Property</text></g>
    <g class="float"><circle cx="240" cy="98" r="17" fill="#1FB16D" fill-opacity="0.14" class="pulse"/><circle cx="240" cy="98" r="12" fill="#1FB16D" filter="url(#softSm)"/><circle cx="236" cy="94" r="3.4" fill="#fff" fill-opacity="0.45"/><text x="240" y="79" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b">Tenant</text></g>
    <g class="float"><circle cx="262" cy="225" r="16" fill="#FFB020" fill-opacity="0.14" class="pulse"/><circle cx="262" cy="225" r="11" fill="#FFB020" filter="url(#softSm)"/><circle cx="258" cy="221" r="3" fill="#fff" fill-opacity="0.45"/><text x="262" y="207" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b">Clause</text></g>
    <g class="float"><circle cx="155" cy="335" r="15" fill="#f7768e" fill-opacity="0.14" class="pulse"/><circle cx="155" cy="335" r="10" fill="#f7768e" filter="url(#softSm)"/><circle cx="151" cy="331" r="2.8" fill="#fff" fill-opacity="0.45"/><text x="155" y="318" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b">Renewal</text></g>
    <g class="float"><circle cx="42" cy="255" r="15" fill="#00E5FF" fill-opacity="0.14" class="pulse"/><circle cx="42" cy="255" r="10" fill="#00E5FF" filter="url(#softSm)"/><circle cx="38" cy="251" r="2.8" fill="#fff" fill-opacity="0.45"/><text x="42" y="238" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b">Rent</text></g>
    <g class="float"><circle cx="58" cy="320" r="14" fill="#7252A4" fill-opacity="0.14" class="pulse"/><circle cx="58" cy="320" r="9" fill="#7252A4" filter="url(#softSm)"/><circle cx="55" cy="317" r="2.5" fill="#fff" fill-opacity="0.45"/><text x="58" y="304" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e293b">Party</text></g>
    <!-- central Lease node -->
    <circle cx="145" cy="205" r="22" fill="#588BFA" fill-opacity="0.14"/>
    <circle cx="145" cy="205" r="17" fill="#588BFA" filter="url(#softSm)"/>
    <circle cx="139" cy="199" r="5" fill="#fff" fill-opacity="0.45"/>
    <text x="145" y="183" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1e293b">Lease</text>
  </g>

  <!-- flow 3 -> 4 -->
  <line class="flow" x1="902" y1="325" x2="952" y2="325" stroke="url(#flowGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M950,320 L958,325 L950,330 Z" fill="#1FB16D"/>

  <!-- Stage 4: Reason & Deliver -->
  <g transform="translate(962,150)">
    <rect x="24" y="0" width="162" height="50" rx="12" fill="url(#blueGrad)" filter="url(#soft)"/>
    <circle cx="48" cy="25" r="4" fill="#fff" class="pulse"/>
    <text x="115" y="31" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">Graph-RAG</text>
    <g stroke="#cbd5e1" stroke-width="1.8" fill="none" stroke-linecap="round">
      <path d="M105,50 C105,68 105,70 105,84"/>
      <path d="M105,132 C105,158 105,158 105,178"/>
      <path d="M105,226 C105,252 105,252 105,272"/>
    </g>
    <!-- output cards -->
    <g transform="translate(10,84)" filter="url(#softSm)"><rect width="190" height="72" rx="14" fill="#fff" stroke="#588BFA" stroke-opacity="0.35"/><rect width="6" height="72" rx="3" fill="#588BFA"/><text x="22" y="31" font-size="14.5" font-weight="800" fill="#1e293b">Ask AI</text><text x="22" y="53" font-size="11" fill="#64748b">Cited, grounded answers</text></g>
    <g transform="translate(10,178)" filter="url(#softSm)"><rect width="190" height="72" rx="14" fill="#fff" stroke="#FFB020" stroke-opacity="0.35"/><rect width="6" height="72" rx="3" fill="#FFB020"/><text x="22" y="31" font-size="14.5" font-weight="800" fill="#1e293b">Risk Dashboard</text><text x="22" y="53" font-size="11" fill="#64748b">Expiry · concentration</text></g>
    <g transform="translate(10,272)" filter="url(#softSm)"><rect width="190" height="72" rx="14" fill="#fff" stroke="#1FB16D" stroke-opacity="0.35"/><rect width="6" height="72" rx="3" fill="#1FB16D"/><text x="22" y="31" font-size="14.5" font-weight="800" fill="#1e293b">Graph Explorer</text><text x="22" y="53" font-size="11" fill="#64748b">Interactive network</text></g>
  </g>

  <!-- Bottom tagline band -->
  <line x1="360" y1="562" x2="840" y2="562" stroke="#cbd5e1" stroke-opacity="0.6"/>
  <text x="600" y="592" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Every answer traced back to graph nodes — not re-read from raw text.</text>
  <text x="600" y="615" text-anchor="middle" font-size="12.5" font-style="italic" fill="#64748b">&#8220;One query thin. Infinitely strong. Inspired by the world&#8217;s strongest material.&#8221;</text>
</svg>
